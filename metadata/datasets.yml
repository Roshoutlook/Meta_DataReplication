datasets:
  employee:
    source_path: abfss://input@replstorageacc.dfs.core.windows.net/employee/Employee.csv
    file_format: csv
    primary_keys: [EmployeeID]
    target_table: replication_catalog.silver.employee_scd2
    schema:
      EmployeeID: int
      Name: string
      Department: string
      Designation: string
      Salary: decimal(18,2)
      JoiningDate: date
      updated_at: timestamp
    tracked_columns:
      - Name
      - Department
      - Designation
      - Salary
      - JoiningDate

  policy:
    source_path: abfss://input@replstorageacc.dfs.core.windows.net/policy/Policy.csv
    file_format: csv
    primary_keys: [PolicyID]
    target_table: replication_catalog.silver.policy_scd2
    schema:
      PolicyID: int
      PolicyName: string
      PolicyType: string
      Premium: decimal(18,2)
      StartDate: date
      EndDate: date
      updated_at: timestamp
    tracked_columns:
      - PolicyName
      - PolicyType
      - Premium
      - StartDate
      - EndDate
