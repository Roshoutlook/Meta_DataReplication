datasets:
  employee:
    source_folder: employee
    file_format: csv
    columns:
      - EmployeeID
      - Name
      - Department
      - Designation
      - Salary
      - JoiningDate
      - updated_at
    primary_keys: [EmployeeID]
    sequence_column: updated_at
    allowed_load_modes: [snapshot, incremental]
    bronze_table: replication_catalog.bronze.employee
    silver_table: replication_catalog.silver.employee

  policy:
    source_folder: policy
    file_format: csv
    columns:
      - PolicyID
      - PolicyName
      - PolicyType
      - Premium
      - StartDate
      - EndDate
      - updated_at
    primary_keys: [PolicyID]
    sequence_column: updated_at
    allowed_load_modes: [snapshot, incremental]
    bronze_table: replication_catalog.bronze.policy
    silver_table: replication_catalog.silver.policy
